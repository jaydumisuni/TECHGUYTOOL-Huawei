[package]
name = "techguy-device-gateway"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
publish = false
description = "Persistent device-inert control plane for TECHGUYTOOL Huawei"

[lib]
name = "techguy_device_gateway"
path = "src/lib.rs"

[[bin]]
name = "ttg-device-gateway"
path = "src/main.rs"

[dependencies]
chrono = { version = "=0.4.38", default-features = false, features = ["clock", "serde", "std"] }
rusqlite = { version = "=0.31.0", features = ["bundled"] }
serde = { version = "=1.0.217", features = ["derive"] }
serde_json = "=1.0.138"
sha2 = "=0.10.8"
techguy-contracts-core = { path = "../contracts_core" }
uuid = { version = "=1.11.0", features = ["v4"] }

[dev-dependencies]
tempfile = "=3.15.0"

[package]
name = "techguy-contracts-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
publish = false
description = "Deterministic shared contract validation for TECHGUYTOOL Huawei"

[lib]
name = "techguy_contracts_core"
path = "src/lib.rs"

[[bin]]
name = "ttg-contracts"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = "1"

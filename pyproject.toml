[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "techguy-tool-huawei"
version = "0.1.0"
description = "TECHGUY TOOL Huawei service and recovery interface"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "THETECHGUY DIGITAL SOLUTIONS"}]
dependencies = ["PySide6==6.11.1"]

[project.optional-dependencies]
test = ["pytest>=8", "Pillow>=10"]

[project.scripts]
techguy-huawei = "main:main"

[tool.setuptools]
packages = ["techguy_huawei"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

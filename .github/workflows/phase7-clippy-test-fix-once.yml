name: Phase 7 One-Shot Clippy Test Correction

on:
  push:
    branches: ["phase7/bounded-executor-framework"]

permissions:
  contents: write

jobs:
  fix:
    if: startsWith(github.event.head_commit.message, 'Request Phase 7 Clippy test correction')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Apply Clippy canonical Box default form
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('rust/device_gateway/tests/executor.rs')
          text = path.read_text(encoding='utf-8')
          old = 'Box::new(MemoryAdapter::default())'
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'expected 2 Box default occurrences, found {count}')
          text = text.replace(old, 'Box::<MemoryAdapter>::default()')
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          test "$(git diff --name-only)" = "rust/device_gateway/tests/executor.rs"
      - name: Commit exact correction
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "THETECHGUY Phase 7 Clippy Corrector"
          git config user.email "actions@users.noreply.github.com"
          git add rust/device_gateway/tests/executor.rs
          git commit -m "Correct Phase 7 Clippy test construction"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:"$BRANCH_NAME"

name: Software Phase Proof

on:
  push:
    branches: ["phase7/**", "phase8/**", "phase9/**", "phase10/**", "phase11/**", "phase12/**", "phase13/**", "phase14/**", "phase15/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: software-phase-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out reviewed revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install Rust 1.75
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.75.0 --profile minimal --component rustfmt --component clippy
          rustup override set 1.75.0
          rustc --version
          cargo --version

      - name: Install proof dependencies
        run: python -m pip install --disable-pip-version-check pytest==8.3.5

      - name: Verify committed dependency locks
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --locked --no-deps --format-version 1 --manifest-path rust/contracts_core/Cargo.toml >/dev/null
          cargo metadata --locked --no-deps --format-version 1 --manifest-path rust/device_gateway/Cargo.toml >/dev/null

      - name: Compile active phase proof surface
        run: >-
          python -m compileall -q
          tools/prove_active_software_phase.py
          tools/verify_software_phase_receipt.py
          tools/verify_historical_phase6_authority.py
          tools/build_active_software_phase_receipt.py
          tools/build_source_inventory.py

      - name: Prove active software phase authority
        run: python tools/prove_active_software_phase.py

      - name: Check Rust formatting
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path rust/contracts_core/Cargo.toml -- --check
          cargo fmt --manifest-path rust/device_gateway/Cargo.toml -- --check

      - name: Reject Rust warnings
        run: cargo clippy --locked --manifest-path rust/device_gateway/Cargo.toml --all-targets -- -D warnings

      - name: Run complete Rust Gateway proof
        run: cargo test --locked --manifest-path rust/device_gateway/Cargo.toml --all-targets

      - name: Re-prove contract core
        run: cargo test --locked --manifest-path rust/contracts_core/Cargo.toml --all-targets

      - name: Remove generated Rust build output before review
        shell: bash
        run: |
          set -euo pipefail
          rm -rf rust/contracts_core/target rust/device_gateway/target

      - name: Regenerate deterministic source inventory
        run: python tools/build_source_inventory.py

      - name: SRG 20-for-2 independent review gate
        run: python tools/review_20_for_2.py --strict

      - name: Re-prove Phase 2 through Phase 6 authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m pytest tests/test_shared_contracts.py tests/test_gateway_client.py tests/test_kirin_xray.py tests/test_kirin_xray_authority.py tests/test_decision_corps.py -q
          python tools/build_phase2_receipt.py --verify
          python tools/build_phase3_receipt.py --verify
          python tools/build_phase4_receipt.py --verify
          python tools/build_phase5_receipt.py --verify --verify-hosted-run
          python tools/verify_historical_phase6_authority.py

      - name: Run complete Python regression
        run: python -m pytest -q

      - name: Verify source freeze and active authority
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python tools/verify_source_freeze.py --json
          git diff --check
          unexpected="$(git diff --name-only | grep -Ev '^manifests/source_inventory\.json$' || true)"
          test -z "$unexpected" || {
            echo "Unexpected generated source changes:" >&2
            echo "$unexpected" >&2
            exit 1
          }
          receipt_status="$(python -c 'import json; c=json.load(open("manifests/active_software_phase.json")); print(json.load(open(c["receipt_path"]))["status"])')"
          if [[ "$EVENT_NAME" == "pull_request" || "$receipt_status" != "UNFROZEN" ]]; then
            git diff --exit-code -- manifests/source_inventory.json
          fi
          if [[ "$receipt_status" != "UNFROZEN" ]]; then
            python tools/verify_software_phase_receipt.py --verify-hosted-run
          fi

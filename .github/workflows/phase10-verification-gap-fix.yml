name: Phase 10 Verification Gap Correction

on:
  push:
    branches: ["phase10/inquiry-governor"]

permissions:
  contents: write

jobs:
  correct:
    if: startsWith(github.event.head_commit.message, 'Request Phase 10 verification-gap correction') && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Apply exact Inquiry Governor correction
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('techguy_huawei/inquiry_governor.py')
          text = path.read_text(encoding='utf-8')
          old_one = '''    readback_ok = verification["readback_match"] is True and executor_result["payload"].get("readback_sha256") is not None\n\n    findings: list[OfficerFinding] = []\n'''
          new_one = '''    readback_ok = verification["readback_match"] is True and executor_result["payload"].get("readback_sha256") is not None\n    verification_unmet = (\n        verification["verdict"] != "verified"\n        or (pred.require_readback_match and not readback_ok)\n    )\n\n    findings: list[OfficerFinding] = []\n'''
          old_two = '''    unexplained_after_accepted = (\n        executor_outcome == pred.required_executor_outcome\n        and (not missing_subjects)\n        and bool(mismatched_subjects or contradictory_subjects)\n        and (not pred.require_readback_match or readback_ok)\n    )\n'''
          new_two = '''    unexplained_after_accepted = (\n        executor_outcome == pred.required_executor_outcome\n        and not missing_subjects\n        and (bool(mismatched_subjects or contradictory_subjects) or verification_unmet)\n    )\n'''
          old_three = '''    needs_gap = bool(missing_subjects or mismatched_subjects or contradictory_subjects)\n    if explained_executor_failure:\n        needs_gap = False\n'''
          new_three = '''    needs_gap = bool(\n        missing_subjects\n        or mismatched_subjects\n        or contradictory_subjects\n        or verification_unmet\n    )\n    if explained_executor_failure:\n        needs_gap = False\n'''
          old_four = '''    elif verification["verdict"] != "verified" or (pred.require_readback_match and not readback_ok):\n        governor_status = "KNOWLEDGE_GAP"\n'''
          new_four = '''    elif verification_unmet:\n        governor_status = "KNOWLEDGE_GAP"\n'''
          replacements = [(old_one,new_one),(old_two,new_two),(old_three,new_three),(old_four,new_four)]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'expected correction anchor missing: {old[:60]!r}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          python -m pip install --disable-pip-version-check pytest==8.3.5
          python -m pytest tests/test_inquiry_governor.py -q
          python tools/prove_phase10_inquiry_governor.py
          git diff --check
          changed="$(git diff --name-only)"
          test "$changed" = "techguy_huawei/inquiry_governor.py" || {
            echo "Unexpected correction files: $changed" >&2
            exit 1
          }
      - name: Commit corrected Inquiry Governor
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "THETECHGUY Phase 10 Corrector"
          git config user.email "actions@users.noreply.github.com"
          git add techguy_huawei/inquiry_governor.py
          git commit -m "Correct Phase 10 verification-gap learning order"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:"$BRANCH_NAME"

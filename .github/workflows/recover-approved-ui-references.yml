name: Recover Approved Huawei UI References

on:
  push:
    branches:
      - phase15/final-ui-closeout

permissions:
  contents: write

jobs:
  recover:
    if: startsWith(github.event.head_commit.message, 'Request approved UI reference recovery')
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact UI branch with history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: phase15/final-ui-closeout
          fetch-depth: 0

      - name: Recover six exact approved PNG blobs by SHA-256
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import re
          import subprocess

          root = Path('.')
          authority = root / 'resources' / 'expected ui' / 'README.md'
          text = authority.read_text(encoding='utf-8')
          # Only the locked-original authority table defines recoverable source blobs.
          # Recovered comparison-copy hashes below this heading are evidence only.
          original_section = text.split('## Recovered comparison copies', 1)[0]
          hashes = re.findall(r'\b[a-fA-F0-9]{64}\b', original_section)
          names = [
              '01-firmware-flash.png',
              '02-settings.png',
              '03-about.png',
              '04-fix-drivers.png',
              '05-register-device.png',
              '06-terminal.png',
          ]
          if len(hashes) != 6 or len(set(h.lower() for h in hashes)) != 6:
              raise SystemExit(f'Expected exactly six unique locked visual-authority SHA-256 values, found {len(hashes)}')
          wanted = {h.lower(): name for h, name in zip(hashes, names)}
          found = {}

          for line in subprocess.check_output(['git', 'rev-list', '--objects', '--all'], text=True).splitlines():
              oid = line.split(' ', 1)[0]
              if len(found) == len(wanted):
                  break
              kind = subprocess.run(['git', 'cat-file', '-t', oid], capture_output=True, text=True)
              if kind.returncode or kind.stdout.strip() != 'blob':
                  continue
              data = subprocess.check_output(['git', 'cat-file', 'blob', oid])
              digest = hashlib.sha256(data).hexdigest()
              if digest in wanted and digest not in found:
                  if not data.startswith(b'\x89PNG\r\n\x1a\n'):
                      raise SystemExit(f'Approved visual blob {digest} is not PNG')
                  found[digest] = data

          missing = [h for h in wanted if h not in found]
          if missing:
              raise SystemExit('Approved visual blobs missing from reachable history: ' + ', '.join(missing))

          out = root / 'resources' / 'expected ui'
          out.mkdir(parents=True, exist_ok=True)
          for digest, name in wanted.items():
              path = out / name
              path.write_bytes(found[digest])
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              if actual != digest:
                  raise SystemExit(f'Hash mismatch after recovery for {name}: {actual} != {digest}')
              print(f'{name}: {actual}')
          PY

      - name: Commit authority images and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/recover-approved-ui-references.yml
          git add 'resources/expected ui/' .github/workflows/recover-approved-ui-references.yml
          git diff --cached --check
          git config user.name 'THE TECH GUY'
          git config user.email '65334711+jaydumisuni@users.noreply.github.com'
          git commit -m 'Restore exact approved Huawei UI references'
          git push origin HEAD:phase15/final-ui-closeout

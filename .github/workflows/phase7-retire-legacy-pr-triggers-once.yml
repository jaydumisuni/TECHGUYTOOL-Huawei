name: Phase 7 One-Shot Legacy PR Trigger Retirement

on:
  push:
    branches: ["phase7/bounded-executor-framework"]

permissions:
  contents: write

jobs:
  retire:
    if: startsWith(github.event.head_commit.message, 'Request legacy phase PR trigger retirement')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Retire stale historical PR triggers
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          paths = [
              Path('.github/workflows/phase2-contracts.yml'),
              Path('.github/workflows/phase3-gateway.yml'),
              Path('.github/workflows/phase4-kirin-xray.yml'),
              Path('.github/workflows/phase5-decision-corps.yml'),
              Path('.github/workflows/phase6-leases.yml'),
          ]
          needle = '  pull_request:\n    branches: [main]\n'
          for path in paths:
              text = path.read_text(encoding='utf-8')
              count = text.count(needle)
              if count != 1:
                  raise SystemExit(f'{path}: expected one legacy pull_request trigger, found {count}')
              text = text.replace(needle, '')
              if '  pull_request:' in text:
                  raise SystemExit(f'{path}: pull_request trigger remains')
              path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            .github/workflows/phase2-contracts.yml \
            .github/workflows/phase3-gateway.yml \
            .github/workflows/phase4-kirin-xray.yml \
            .github/workflows/phase5-decision-corps.yml \
            .github/workflows/phase6-leases.yml | sort)"
          test "$changed" = "$expected"
      - name: Commit exact workflow retirement
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "THETECHGUY Phase 7 CI Authority"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/phase2-contracts.yml .github/workflows/phase3-gateway.yml .github/workflows/phase4-kirin-xray.yml .github/workflows/phase5-decision-corps.yml .github/workflows/phase6-leases.yml
          git commit -m "Retire historical phase PR triggers"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:"$BRANCH_NAME"

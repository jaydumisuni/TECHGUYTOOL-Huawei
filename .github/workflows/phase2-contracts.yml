name: Phase 2 Shared Contracts

on:
  push:
    branches: ["phase2/shared-contracts"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase2-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-proof:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact reviewed revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install reviewed Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.75.0 --profile minimal --component rustfmt clippy
          rustup override set 1.75.0
          rustc --version
          cargo --version

      - name: Install Python proof dependency
        run: python -m pip install --disable-pip-version-check pytest==8.3.5

      - name: Compile deterministic Python contract modules
        run: >-
          python -m compileall -q
          techguy_huawei/contract_fields.py
          techguy_huawei/contract_models.py
          techguy_huawei/contract_support.py
          techguy_huawei/contract_validation.py
          techguy_huawei/contracts.py
          tests/test_shared_contracts.py
          tools/build_phase2_receipt.py
          tools/build_source_inventory.py
          tools/prove_context_equivalence.py
          tools/prove_contract_equivalence.py

      - name: Prove Python fixtures and safety boundaries
        run: python -m pytest tests/test_shared_contracts.py -q

      - name: Check Rust formatting
        run: cargo fmt --manifest-path rust/contracts_core/Cargo.toml -- --check

      - name: Reject Rust warnings
        run: cargo clippy --manifest-path rust/contracts_core/Cargo.toml --all-targets -- -D warnings

      - name: Prove Rust fixtures and safety boundaries
        run: cargo test --manifest-path rust/contracts_core/Cargo.toml --all-targets

      - name: Build deterministic Rust validator
        run: cargo build --manifest-path rust/contracts_core/Cargo.toml --bin ttg-contracts

      - name: Prove exact Python and Rust contract equivalence
        run: >-
          python tools/prove_contract_equivalence.py
          --rust-bin rust/contracts_core/target/debug/ttg-contracts

      - name: Prove exact Python and Rust validation-context equivalence
        run: >-
          python tools/prove_context_equivalence.py
          --rust-bin rust/contracts_core/target/debug/ttg-contracts

      - name: Regenerate deterministic source inventory
        run: python tools/build_source_inventory.py

      - name: Run complete non-Qt Python regression suite
        run: python -m pytest -q

      - name: Verify source inventory and traceable receipt authority
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          IS_FREEZE_COMMIT: ${{ startsWith(github.event.head_commit.message, 'Freeze Phase 2 contract inventory and proof receipt') }}
        run: |
          set -euo pipefail
          python tools/verify_source_freeze.py --json
          git diff --check
          unexpected="$(git diff --name-only | grep -Ev '^manifests/source_inventory\.json$' || true)"
          test -z "$unexpected" || {
            echo "Unexpected generated source changes:" >&2
            echo "$unexpected" >&2
            exit 1
          }
          if [[ "$EVENT_NAME" == "pull_request" || "$IS_FREEZE_COMMIT" == "true" ]]; then
            git diff --exit-code -- manifests/source_inventory.json
            python tools/build_phase2_receipt.py --verify
          fi

  freeze-authority:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/phase2/shared-contracts' &&
      github.actor == 'jaydumisuni' &&
      !startsWith(github.event.head_commit.message, 'Freeze Phase 2 contract inventory and proof receipt')
    needs: contract-proof
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the proven source revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Install Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Generate traceable authority files
        shell: bash
        env:
          TESTED_REVISION: ${{ github.sha }}
          PROOF_RUN_ID: ${{ github.run_id }}
          PROOF_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          generated_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          python tools/build_source_inventory.py
          python tools/build_phase2_receipt.py \
            --tested-revision "$TESTED_REVISION" \
            --proof-run-id "$PROOF_RUN_ID" \
            --generated-at "$generated_at" \
            --proof-run-url "$PROOF_RUN_URL"
          python tools/verify_source_freeze.py --json
          python tools/build_phase2_receipt.py --verify
          git diff --check
          unexpected="$(git diff --name-only | grep -Ev '^manifests/source_inventory(\.receipt)?\.json$' || true)"
          test -z "$unexpected" || {
            echo "Refusing to freeze unexpected files:" >&2
            echo "$unexpected" >&2
            exit 1
          }

      - name: Freeze generated Phase 2 authority on branch
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- manifests/source_inventory.json manifests/source_inventory.receipt.json; then
            echo "Phase 2 authority is already frozen."
            exit 0
          fi
          git config user.name "THETECHGUY Phase Freezer"
          git config user.email "actions@users.noreply.github.com"
          git add manifests/source_inventory.json manifests/source_inventory.receipt.json
          git commit -m "Freeze Phase 2 contract inventory and proof receipt"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:phase2/shared-contracts

name: Phase 15 Windows Release Candidate

on:
  push:
    branches: ["phase15/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-release-candidate:
    # Nuitka 2.6.8 is frozen for this release. Pin the hosted image so
    # GitHub's windows-latest Visual Studio generation cannot drift under it.
    runs-on: windows-2022
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Set up Rust 1.75
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          rustup toolchain install 1.75.0 --profile minimal
          rustup override set 1.75.0
          rustc --version
          cargo --version

      - name: Install release dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]" "nuitka==2.6.8" ordered_set zstandard
          $deploy = Get-Command pyside6-deploy -ErrorAction Stop
          Write-Host "pyside6-deploy=$($deploy.Source)"

      - name: Prove clean Windows servicing primitives
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PnPUtil = Get-Command pnputil.exe -ErrorAction Stop
          $PnP = Get-Command Get-PnpDevice -ErrorAction Stop
          Write-Host "pnputil=$($PnPUtil.Source)"
          Write-Host "Get-PnpDevice=$($PnP.Source)"
          $sample = Get-PnpDevice -PresentOnly | Select-Object -First 3 Status, Class, FriendlyName, InstanceId
          if (-not $sample) { throw "Clean Windows runner exposed no present PnP inventory." }
          $sample | ConvertTo-Json -Depth 4 | Write-Host

      - name: Locate Windows signing tool
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = "${env:ProgramFiles(x86)}\Windows Kits\10\bin"
          $tool = Get-ChildItem -Path $root -Filter signtool.exe -Recurse -ErrorAction Stop |
            Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $tool) { throw "signtool.exe was not found on the Windows runner." }
          $tool.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "signtool=$($tool.FullName)"

      - name: Create isolated CI test-signing PFX
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $passwordBytes = [byte[]]::new(32)
          [System.Security.Cryptography.RandomNumberGenerator]::Fill($passwordBytes)
          $password = [Convert]::ToBase64String($passwordBytes)
          Write-Output "::add-mask::$password"
          $rsa = [System.Security.Cryptography.RSA]::Create(2048)
          try {
            $request = [System.Security.Cryptography.X509Certificates.CertificateRequest]::new(
              "CN=THETECHGUY Phase15 CI Test Signing - NOT FOR PRODUCTION",
              $rsa,
              [System.Security.Cryptography.HashAlgorithmName]::SHA256,
              [System.Security.Cryptography.RSASignaturePadding]::Pkcs1
            )
            $oids = [System.Security.Cryptography.OidCollection]::new()
            [void]$oids.Add([System.Security.Cryptography.Oid]::new("1.3.6.1.5.5.7.3.3"))
            $request.CertificateExtensions.Add(
              [System.Security.Cryptography.X509Certificates.X509EnhancedKeyUsageExtension]::new($oids, $false)
            )
            $certificate = $request.CreateSelfSigned((Get-Date).AddMinutes(-5), (Get-Date).AddDays(1))
            $pfx = Join-Path $env:RUNNER_TEMP "phase15-ci-test-signing.pfx"
            [System.IO.File]::WriteAllBytes(
              $pfx,
              $certificate.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Pfx, $password)
            )
            "TECHGUY_CI_TEST_SIGNING_PFX=$pfx" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "TECHGUY_CI_TEST_SIGNING_PASSWORD=$password" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            Write-Host "Created short-lived CI-only PFX. No trust-store mutation was performed."
          } finally {
            $rsa.Dispose()
          }

      - name: Prove source-mode QML startup before packaging
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          TECHGUY_STARTUP_PROBE: "1"
        run: |
          $ErrorActionPreference = "Stop"
          $diag = Join-Path $env:RUNNER_TEMP "phase15-source-startup.json"
          $env:TECHGUY_STARTUP_DIAGNOSTIC_PATH = $diag
          $probe = Start-Process -FilePath "python" -ArgumentList @("main.py") -PassThru
          if (-not $probe.WaitForExit(30000)) {
            Stop-Process -Id $probe.Id -Force -ErrorAction SilentlyContinue
            if (Test-Path $diag) { Get-Content $diag -Raw | Write-Host }
            throw "Source-mode startup probe exceeded the 30-second deadline."
          }
          $probeExit = $probe.ExitCode
          if ($probeExit -ne 0) {
            if (Test-Path $diag) { Get-Content $diag -Raw | Write-Host }
            throw "Source-mode startup probe failed with exit code $probeExit."
          }
          if (-not (Test-Path $diag)) { throw "Source-mode startup diagnostic was not created." }
          $state = Get-Content $diag -Raw | ConvertFrom-Json
          if ($state.stage -ne "qml_root_ready") {
            Get-Content $diag -Raw | Write-Host
            throw "Source-mode startup did not reach qml_root_ready."
          }
          Write-Host "Source-mode QML startup reached qml_root_ready."

      - name: Build and CI-sign canonical one-file executable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          .\build_windows.ps1 -SkipInstall -CiTestSigning

      - name: Verify Authenticode, checksum and provenance
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Get-ChildItem -Path dist -Filter "TECHGUYTOOL_Huawei.exe" -Recurse | Select-Object -First 1
          if (-not $exe) { throw "Release executable missing." }
          $sig = Get-AuthenticodeSignature $exe.FullName
          if (-not $sig.SignerCertificate) { throw "CI Authenticode signer is missing." }
          if ($sig.SignerCertificate.Subject -notlike "*THETECHGUY Phase15 CI Test Signing - NOT FOR PRODUCTION*") {
            throw "CI Authenticode signer identity mismatch."
          }
          $sumPath = Join-Path $exe.DirectoryName "SHA256SUMS.txt"
          $provPath = Join-Path $exe.DirectoryName "RELEASE_PROVENANCE.json"
          if (-not (Test-Path $sumPath) -or -not (Test-Path $provPath)) { throw "Release evidence files missing." }
          $expected = ((Get-Content $sumPath -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash -Algorithm SHA256 $exe.FullName).Hash.ToLowerInvariant()
          if ($expected -ne $actual) { throw "SHA-256 checksum mismatch." }
          $prov = Get-Content $provPath -Raw | ConvertFrom-Json
          if ($prov.sha256 -ne $actual) { throw "Release provenance hash mismatch." }
          if ($prov.signing_mode -ne "ci-test-authenticode" -or $prov.ci_test_signature -ne $true) {
            throw "CI signing provenance mismatch."
          }
          if ($prov.production_signature -ne $false) { throw "CI artifact may not claim production signature." }
          Write-Host "CI-signed one-file SHA256=$actual"

      - name: Prove packaged QML startup and restart after forced close
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Get-ChildItem -Path dist -Filter "TECHGUYTOOL_Huawei.exe" -Recurse | Select-Object -First 1
          if (-not $exe) { throw "Release executable missing." }

          $diag = Join-Path $env:RUNNER_TEMP "phase15-packaged-startup.json"
          $env:TECHGUY_STARTUP_DIAGNOSTIC_PATH = $diag
          $env:TECHGUY_STARTUP_PROBE = "1"
          $probe = Start-Process -FilePath $exe.FullName -PassThru
          if (-not $probe.WaitForExit(30000)) {
            Stop-Process -Id $probe.Id -Force -ErrorAction SilentlyContinue
            Remove-Item Env:TECHGUY_STARTUP_PROBE -ErrorAction SilentlyContinue
            if (Test-Path $diag) { Get-Content $diag -Raw | Write-Host }
            throw "Packaged startup probe exceeded the 30-second deadline."
          }
          $probeExit = $probe.ExitCode
          Remove-Item Env:TECHGUY_STARTUP_PROBE -ErrorAction SilentlyContinue
          if ($probeExit -ne 0) {
            if (Test-Path $diag) { Get-Content $diag -Raw | Write-Host }
            throw "Packaged startup probe failed with exit code $probeExit."
          }
          if (-not (Test-Path $diag)) { throw "Packaged startup diagnostic was not created." }
          $state = Get-Content $diag -Raw | ConvertFrom-Json
          if ($state.stage -ne "qml_root_ready") {
            Get-Content $diag -Raw | Write-Host
            throw "Packaged startup did not reach qml_root_ready."
          }
          Write-Host "Packaged QML startup reached qml_root_ready."

          function Test-Launch([string]$label) {
            $process = Start-Process -FilePath $exe.FullName -PassThru
            Start-Sleep -Seconds 8
            if ($process.HasExited) {
              if (Test-Path $diag) { Get-Content $diag -Raw | Write-Host }
              throw "$label launch exited early with code $($process.ExitCode)."
            }
            Stop-Process -Id $process.Id -Force
            Wait-Process -Id $process.Id -ErrorAction SilentlyContinue
            Write-Host "$label launch survived extraction/startup and was forcibly closed."
          }
          Test-Launch "first"
          Start-Sleep -Seconds 2
          Test-Launch "restart"

      - name: Upload Windows release-candidate evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: TECHGUYTOOL-Huawei-phase15-windows-candidate
          path: |
            dist/**/TECHGUYTOOL_Huawei.exe
            dist/**/SHA256SUMS.txt
            dist/**/RELEASE_PROVENANCE.json
          if-no-files-found: error
          retention-days: 7

name: Final Huawei UI Shell Tune

on:
  push:
    branches:
      - phase15/final-ui-closeout

permissions:
  contents: write

jobs:
  tune:
    if: startsWith(github.event.head_commit.message, 'Apply Huawei final shell visual tune')
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact UI branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: phase15/final-ui-closeout
          fetch-depth: 0

      - name: Tune only approved shell lighting and mascot scale
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('qml/Main.qml')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'opacity: 0.72': 'opacity: 0.84',
              'rgba(172,58,255,0.46)': 'rgba(172,58,255,0.58)',
              'rgba(0,177,255,0.40)': 'rgba(0,177,255,0.50)',
              'rgba(165,70,255,0.34)': 'rgba(165,70,255,0.43)',
              'ctx.lineWidth = 24': 'ctx.lineWidth = 28',
              'rgba(0,139,255,0.24)': 'rgba(0,139,255,0.31)',
              'rgba(202,62,255,0.24)': 'rgba(202,62,255,0.32)',
              'rgba(75,168,255,0.16)': 'rgba(75,168,255,0.23)',
              'Layout.preferredHeight: 360': 'Layout.preferredHeight: 410',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one {old!r}, found {count}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          rm -f .github/workflows/ui-shell-final-tune.yml
          git diff --check

      - name: Commit final approved shell tune
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'THE TECH GUY'
          git config user.email '65334711+jaydumisuni@users.noreply.github.com'
          git add qml/Main.qml .github/workflows/ui-shell-final-tune.yml
          git commit -m 'Tune approved Huawei shell lighting and mascot scale'
          git push origin HEAD:phase15/final-ui-closeout

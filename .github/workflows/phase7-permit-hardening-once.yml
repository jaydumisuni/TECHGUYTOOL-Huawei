name: Phase 7 One-Shot Permit Hardening

on:
  push:
    branches: ["phase7/bounded-executor-framework"]

permissions:
  contents: write

jobs:
  harden:
    if: >-
      github.actor == 'jaydumisuni' &&
      startsWith(github.event.head_commit.message, 'Request Phase 7 permit hardening')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Harden permit construction boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path

          path = Path('rust/device_gateway/src/lease.rs')
          text = path.read_text(encoding='utf-8')
          pattern = re.compile(
              r'#\[derive\(Debug, Clone, Eq, PartialEq, Serialize, Deserialize\)\]\n'
              r'pub struct ExecutionPermit \{.*?\n\}\n',
              re.S,
          )
          replacement = '''#[derive(Debug, Eq, PartialEq, Serialize)]
          pub struct ExecutionPermit {
              lease_id: String,
              physical_session_id: String,
              recipe_hash: String,
              adapter_id: String,
              adapter_version: String,
              artifact_hashes: Vec<String>,
              partition: String,
              range_manifest_sha256: String,
              max_write_bytes: u64,
              requested_write_bytes: u64,
              current_mode: String,
              stage_id: String,
              reboot_allowed: bool,
              claimed_at: String,
          }

          impl ExecutionPermit {
              pub fn lease_id(&self) -> &str { &self.lease_id }
              pub fn physical_session_id(&self) -> &str { &self.physical_session_id }
              pub fn recipe_hash(&self) -> &str { &self.recipe_hash }
              pub fn adapter_id(&self) -> &str { &self.adapter_id }
              pub fn adapter_version(&self) -> &str { &self.adapter_version }
              pub fn artifact_hashes(&self) -> &[String] { &self.artifact_hashes }
              pub fn partition(&self) -> &str { &self.partition }
              pub fn range_manifest_sha256(&self) -> &str { &self.range_manifest_sha256 }
              pub fn max_write_bytes(&self) -> u64 { self.max_write_bytes }
              pub fn requested_write_bytes(&self) -> u64 { self.requested_write_bytes }
              pub fn current_mode(&self) -> &str { &self.current_mode }
              pub fn stage_id(&self) -> &str { &self.stage_id }
              pub fn reboot_allowed(&self) -> bool { self.reboot_allowed }
              pub fn claimed_at(&self) -> &str { &self.claimed_at }
          }
          '''.replace('          ', '')
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'expected one ExecutionPermit definition, changed {count}')

          ctor = re.compile(
              r'Ok\(ExecutionPermit \{\n'
              r'\s*lease_id,\n'
              r'\s*physical_session_id: context\.physical_session_id\.clone\(\),\n'
              r'\s*stage_id: context\.stage_id\.clone\(\),\n'
              r'\s*partition: context\.partition\.clone\(\),\n'
              r'\s*max_write_bytes,\n'
              r'\s*requested_write_bytes: context\.write_bytes,\n'
              r'\s*reboot_allowed,\n'
              r'\s*claimed_at: context\.now\.clone\(\),\n'
              r'\s*\}\)',
              re.S,
          )
          ctor_replacement = '''Ok(ExecutionPermit {
              lease_id,
              physical_session_id: context.physical_session_id.clone(),
              recipe_hash: context.recipe_hash.clone(),
              adapter_id: context.adapter_id.clone(),
              adapter_version: context.adapter_version.clone(),
              artifact_hashes: context.artifact_hashes.clone(),
              partition: context.partition.clone(),
              range_manifest_sha256: context.range_manifest_sha256.clone(),
              max_write_bytes,
              requested_write_bytes: context.write_bytes,
              current_mode: context.current_mode.clone(),
              stage_id: context.stage_id.clone(),
              reboot_allowed,
              claimed_at: context.now.clone(),
          })'''
          text, count = ctor.subn(ctor_replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'expected one ExecutionPermit constructor, changed {count}')
          if 'pub lease_id:' in text or 'ExecutionPermit {' not in text:
              raise SystemExit('permit hardening postcondition failed')
          path.write_text(text, encoding='utf-8')

          tests = Path('rust/device_gateway/tests/leases.rs')
          data = tests.read_text(encoding='utf-8')
          data = data.replace('permit.lease_id, EXEC_LEASE_ID', 'permit.lease_id(), EXEC_LEASE_ID')
          tests.write_text(data, encoding='utf-8')
          PY
          rustup toolchain install 1.75.0 --profile minimal --component rustfmt
          rustup override set 1.75.0
          cargo fmt --manifest-path rust/device_gateway/Cargo.toml
          git diff --check
          unexpected="$(git diff --name-only | grep -Ev '^(rust/device_gateway/src/lease\.rs|rust/device_gateway/tests/leases\.rs)$' || true)"
          test -z "$unexpected" || { echo "$unexpected" >&2; exit 1; }
      - name: Commit hardened permit
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "THETECHGUY Phase 7 Hardener"
          git config user.email "actions@users.noreply.github.com"
          git add rust/device_gateway/src/lease.rs rust/device_gateway/tests/leases.rs
          git commit -m "Harden execution permit construction boundary"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:phase7/bounded-executor-framework

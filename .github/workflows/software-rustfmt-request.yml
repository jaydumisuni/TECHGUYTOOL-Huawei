name: Software Phase Rustfmt Request

on:
  push:
    branches: ["phase*/**"]

permissions:
  contents: write

jobs:
  format:
    if: >-
      github.actor == 'jaydumisuni' &&
      startsWith(github.event.head_commit.message, 'Request software phase rustfmt')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Install Rust 1.75
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.75.0 --profile minimal --component rustfmt
          rustup override set 1.75.0
      - name: Format reviewed Rust crates
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path rust/contracts_core/Cargo.toml
          cargo fmt --manifest-path rust/device_gateway/Cargo.toml
          git diff --check
          unexpected="$(git diff --name-only | grep -Ev '^rust/(contracts_core|device_gateway)/.*\.rs$' || true)"
          test -z "$unexpected" || { echo "$unexpected" >&2; exit 1; }
      - name: Commit formatter output
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if git diff --quiet -- rust/contracts_core rust/device_gateway; then
            echo "Rust already formatted."
            exit 0
          fi
          git config user.name "THETECHGUY Software Phase Formatter"
          git config user.email "actions@users.noreply.github.com"
          git add rust/contracts_core rust/device_gateway
          git commit -m "Format active software phase Rust"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:"$BRANCH_NAME"

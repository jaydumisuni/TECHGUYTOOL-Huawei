name: Phase 4 Harden Kirin Xray

on:
  push:
    branches: ["phase4/harden-kirin-xray"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: phase4-kirin-xray-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - name: Check out reviewed revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install Rust 1.75
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.75.0 --profile minimal --component rustfmt --component clippy
          rustup override set 1.75.0
          rustc --version
          cargo --version

      - name: Install proof dependencies
        run: python -m pip install --disable-pip-version-check pytest==8.3.5

      - name: Compile Phase 4 Python
        run: >-
          python -m compileall -q
          techguy_huawei/kirin_xray.py
          techguy_huawei/kirin_xray_authority.py
          tests/test_kirin_xray.py
          tests/test_kirin_xray_authority.py
          tools/prove_kirin_xray_replay.py
          tools/build_phase4_receipt.py
          tools/build_source_inventory.py

      - name: Test Kirin Xray replay and source authority
        run: >-
          python -m pytest
          tests/test_kirin_xray.py
          tests/test_kirin_xray_authority.py -q

      - name: Regenerate deterministic source inventory before global review
        run: python tools/build_source_inventory.py

      - name: SRG 20-for-2 independent review gate
        run: python tools/review_20_for_2.py --strict

      - name: Check Gateway formatting
        run: cargo fmt --manifest-path rust/device_gateway/Cargo.toml -- --check

      - name: Check Gateway warnings
        run: >-
          cargo clippy --locked
          --manifest-path rust/device_gateway/Cargo.toml
          --all-targets -- -D warnings

      - name: Test Gateway
        run: cargo test --locked --manifest-path rust/device_gateway/Cargo.toml --all-targets

      - name: Build Gateway
        run: >-
          cargo build --locked
          --manifest-path rust/device_gateway/Cargo.toml
          --bin ttg-device-gateway

      - name: Prove real Gateway replay and restart
        run: >-
          python tools/prove_kirin_xray_replay.py
          --gateway-bin rust/device_gateway/target/debug/ttg-device-gateway

      - name: Re-prove Phase 2 and Phase 3
        run: |
          python -m pytest tests/test_shared_contracts.py tests/test_gateway_client.py -q
          cargo test --manifest-path rust/contracts_core/Cargo.toml --locked --all-targets
          python tools/build_phase2_receipt.py --verify
          python tools/build_phase3_receipt.py --verify

      - name: Run complete Python regression
        run: python -m pytest -q

      - name: Verify source freeze
        run: python tools/verify_source_freeze.py --json

      - name: Verify source and frozen authority boundaries
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_TOKEN: ${{ github.token }}
          IS_AUTHORITY_FREEZE: ${{ startsWith(github.event.head_commit.message, 'Freeze Phase 4 Kirin Xray proof authority') }}
          IS_OWNER_VERIFICATION: ${{ startsWith(github.event.head_commit.message, 'Confirm Phase 4 owner verification') }}
        run: |
          set -euo pipefail
          git diff --check
          unexpected="$(git diff --name-only | grep -Ev '^manifests/source_inventory\.json$' || true)"
          test -z "$unexpected" || {
            echo "Unexpected generated source changes:" >&2
            echo "$unexpected" >&2
            exit 1
          }
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --exit-code -- manifests/source_inventory.json
          elif [[ "$IS_AUTHORITY_FREEZE" == "true" || "$IS_OWNER_VERIFICATION" == "true" ]]; then
            git diff --exit-code -- manifests/source_inventory.json
            python tools/build_phase4_receipt.py --verify --verify-hosted-run
          fi

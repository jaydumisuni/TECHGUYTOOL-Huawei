name: Phase 4 Harden Kirin Xray

on:
  push:
    branches: ["phase4/harden-kirin-xray"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase4-kirin-xray-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - name: Check out reviewed revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install Rust 1.75
        run: |
          rustup toolchain install 1.75.0 --profile minimal --component rustfmt --component clippy
          rustup override set 1.75.0
          rustc --version
          cargo --version

      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest==8.3.5

      - name: Compile Phase 4 Python
        run: >-
          python -m compileall -q
          techguy_huawei/kirin_xray.py
          techguy_huawei/kirin_xray_authority.py
          tests/test_kirin_xray.py
          tests/test_kirin_xray_authority.py
          tools/prove_kirin_xray_replay.py
          tools/build_source_inventory.py

      - name: Test Kirin Xray replay and source authority
        run: >-
          python -m pytest
          tests/test_kirin_xray.py
          tests/test_kirin_xray_authority.py -q

      - name: Resolve Gateway lock
        run: cargo generate-lockfile --manifest-path rust/device_gateway/Cargo.toml

      - name: Check Gateway formatting
        run: cargo fmt --manifest-path rust/device_gateway/Cargo.toml -- --check

      - name: Check Gateway warnings
        run: >-
          cargo clippy --locked
          --manifest-path rust/device_gateway/Cargo.toml
          --all-targets -- -D warnings

      - name: Test Gateway
        run: cargo test --locked --manifest-path rust/device_gateway/Cargo.toml --all-targets

      - name: Build Gateway
        run: >-
          cargo build --locked
          --manifest-path rust/device_gateway/Cargo.toml
          --bin ttg-device-gateway

      - name: Prove real Gateway replay and restart
        run: >-
          python tools/prove_kirin_xray_replay.py
          --gateway-bin rust/device_gateway/target/debug/ttg-device-gateway

      - name: Re-prove Phase 2 and Phase 3
        run: |
          python -m pytest tests/test_shared_contracts.py tests/test_gateway_client.py -q
          cargo test --manifest-path rust/contracts_core/Cargo.toml --locked --all-targets
          python tools/build_phase2_receipt.py --verify
          python tools/build_phase3_receipt.py --verify

      - name: Regenerate deterministic source inventory
        run: python tools/build_source_inventory.py

      - name: Run complete Python regression
        run: python -m pytest -q

      - name: Verify source freeze
        run: python tools/verify_source_freeze.py --json

      - name: Verify generated paths
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          IS_INVENTORY_FREEZE: ${{ startsWith(github.event.head_commit.message, 'Freeze Phase 4 source inventory') }}
        run: |
          set -euo pipefail
          git diff --check
          unexpected="$(git diff --name-only | grep -Ev '^(manifests/source_inventory\.json|rust/device_gateway/Cargo\.lock)$' || true)"
          test -z "$unexpected" || {
            echo "Unexpected generated source changes:" >&2
            echo "$unexpected" >&2
            exit 1
          }
          if [[ "$EVENT_NAME" == "pull_request" || "$IS_INVENTORY_FREEZE" == "true" ]]; then
            git diff --exit-code -- manifests/source_inventory.json rust/device_gateway/Cargo.lock
          fi

  freeze-inventory:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/phase4/harden-kirin-xray' &&
      github.actor == 'jaydumisuni' &&
      !startsWith(github.event.head_commit.message, 'Freeze Phase 4 source inventory')
    needs: proof
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out proven source revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Install Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Generate exact source inventory
        run: |
          python tools/build_source_inventory.py
          python tools/verify_source_freeze.py --json
          git diff --check
          unexpected="$(git diff --name-only | grep -Ev '^manifests/source_inventory\.json$' || true)"
          test -z "$unexpected" || {
            echo "Refusing to freeze unexpected files:" >&2
            echo "$unexpected" >&2
            exit 1
          }

      - name: Freeze inventory on branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- manifests/source_inventory.json; then
            echo "Phase 4 source inventory is already current."
            exit 0
          fi
          git config user.name "THETECHGUY Phase 4 Freezer"
          git config user.email "actions@users.noreply.github.com"
          git add manifests/source_inventory.json
          git commit -m "Freeze Phase 4 source inventory"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:phase4/harden-kirin-xray

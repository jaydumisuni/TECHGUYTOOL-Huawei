# Existing one-shot workflow; this edit is the execution trigger and the job removes itself.
name: Restore Approved Huawei Header Logo

on:
  push:
    branches:
      - phase15/final-ui-closeout

permissions:
  contents: write

jobs:
  restore:
    if: startsWith(github.event.head_commit.message, 'Request approved Huawei header logo restore')
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact UI branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: phase15/final-ui-closeout
          fetch-depth: 0

      - name: Restore exact header ghost source routing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          main = Path('qml/Main.qml')
          source = main.read_text(encoding='utf-8')
          old = '../assets/brand/techguy_logo.png'
          new = '../assets/brand/techguy_logo.svg'
          if source.count(old) != 1:
              raise SystemExit(f'Expected one header PNG route, found {source.count(old)}')
          main.write_text(source.replace(old, new, 1), encoding='utf-8')

          qrc = Path('resources.qrc')
          text = qrc.read_text(encoding='utf-8')
          old_qrc = '    <file alias="assets/brand/techguy_logo.png">assets/brand/techguy_logo.png</file>'
          new_qrc = '    <file alias="assets/brand/techguy_logo.svg">assets/brand/techguy_logo.svg</file>'
          if text.count(old_qrc) != 1:
              raise SystemExit(f'Expected one header PNG QRC route, found {text.count(old_qrc)}')
          qrc.write_text(text.replace(old_qrc, new_qrc, 1), encoding='utf-8')
          PY
          git rm -f assets/brand/techguy_logo.png
          rm -f .github/workflows/ui-header-logo-restore.yml
          git diff --check

      - name: Commit exact approved header routing
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'THE TECH GUY'
          git config user.email '65334711+jaydumisuni@users.noreply.github.com'
          git add qml/Main.qml resources.qrc assets/brand/techguy_logo.svg assets/brand/techguy_logo.png .github/workflows/ui-header-logo-restore.yml
          git commit -m 'Restore approved Huawei header ghost routing'
          git push origin HEAD:phase15/final-ui-closeout

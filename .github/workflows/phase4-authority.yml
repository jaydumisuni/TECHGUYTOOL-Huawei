name: Phase 4 Kirin Xray Authority Freezer

on:
  workflow_run:
    workflows: ["Phase 4 Harden Kirin Xray"]
    types: [completed]
  push:
    branches: ["phase4/harden-kirin-xray"]

permissions:
  actions: read
  contents: write

concurrency:
  group: phase4-kirin-xray-authority
  cancel-in-progress: false

jobs:
  freeze-from-completed-run:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'phase4/harden-kirin-xray' &&
      github.event.workflow_run.actor.login == 'jaydumisuni' &&
      !startsWith(github.event.workflow_run.head_commit.message, 'Freeze Phase 4 Kirin Xray proof authority') &&
      !startsWith(github.event.workflow_run.head_commit.message, 'Confirm Phase 4 owner verification') &&
      !startsWith(github.event.workflow_run.head_commit.message, 'Request Phase 4 authority freeze')
    runs-on: ubuntu-latest
    steps:
      - name: Check out completed proven source revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Build authority from completed successful proof run
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TESTED_REVISION: ${{ github.event.workflow_run.head_sha }}
          PROOF_RUN_ID: ${{ github.event.workflow_run.id }}
          PROOF_RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          generated_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          python tools/build_source_inventory.py
          python tools/build_phase4_receipt.py \
            --verify-hosted-run \
            --tested-revision "$TESTED_REVISION" \
            --proof-run-id "$PROOF_RUN_ID" \
            --generated-at "$generated_at" \
            --proof-run-url "$PROOF_RUN_URL"
          python tools/verify_source_freeze.py --json
          python tools/build_phase2_receipt.py --verify
          python tools/build_phase3_receipt.py --verify
          python tools/build_phase4_receipt.py --verify --verify-hosted-run
          git diff --check
          unexpected="$(git diff --name-only | grep -Ev '^(manifests/phase4_kirin_xray\.receipt\.json|manifests/source_inventory\.json)$' || true)"
          test -z "$unexpected" || {
            echo "Refusing to freeze unexpected files:" >&2
            echo "$unexpected" >&2
            exit 1
          }

      - name: Freeze traceable Phase 4 proof authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "THETECHGUY Phase 4 Freezer"
          git config user.email "actions@users.noreply.github.com"
          git add manifests/phase4_kirin_xray.receipt.json manifests/source_inventory.json
          if git diff --cached --quiet; then
            echo "Phase 4 authority already matches the completed proof run."
            exit 0
          fi
          git commit -m "Freeze Phase 4 Kirin Xray proof authority"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:phase4/harden-kirin-xray

  freeze-from-request:
    if: >-
      github.event_name == 'push' &&
      github.actor == 'jaydumisuni' &&
      startsWith(github.event.head_commit.message, 'Request Phase 4 authority freeze')
    runs-on: ubuntu-latest
    steps:
      - name: Check out authority request
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Install Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Resolve completed successful proof for parent source revision
        id: proof
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tested_revision="$(git rev-parse HEAD^)"
          export TESTED_REVISION="$tested_revision"
          python - <<'PY' > /tmp/phase4-proof.json
          import json
          import os
          import urllib.parse
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          tested_revision = os.environ["TESTED_REVISION"]
          token = os.environ["GITHUB_TOKEN"]
          query = urllib.parse.urlencode({
              "head_sha": tested_revision,
              "event": "push",
              "status": "completed",
              "per_page": 50,
          })
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repository}/actions/runs?{query}",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "TECHGUYTOOL-Huawei-phase4-authority",
              },
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              payload = json.load(response)
          matches = [
              run
              for run in payload.get("workflow_runs", [])
              if run.get("name") == "Phase 4 Harden Kirin Xray"
              and run.get("head_sha") == tested_revision
              and run.get("status") == "completed"
              and run.get("conclusion") == "success"
          ]
          if not matches:
              raise SystemExit(
                  "No completed successful Phase 4 proof run exists for the parent source revision"
              )
          run = max(matches, key=lambda item: int(item["id"]))
          print(json.dumps({"id": run["id"], "url": run["html_url"]}))
          PY
          proof_run_id="$(python -c 'import json; print(json.load(open("/tmp/phase4-proof.json"))["id"])')"
          proof_run_url="$(python -c 'import json; print(json.load(open("/tmp/phase4-proof.json"))["url"])')"
          echo "tested_revision=$tested_revision" >> "$GITHUB_OUTPUT"
          echo "proof_run_id=$proof_run_id" >> "$GITHUB_OUTPUT"
          echo "proof_run_url=$proof_run_url" >> "$GITHUB_OUTPUT"

      - name: Build authority from resolved completed proof
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TESTED_REVISION: ${{ steps.proof.outputs.tested_revision }}
          PROOF_RUN_ID: ${{ steps.proof.outputs.proof_run_id }}
          PROOF_RUN_URL: ${{ steps.proof.outputs.proof_run_url }}
        run: |
          set -euo pipefail
          generated_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          python tools/build_source_inventory.py
          python tools/build_phase4_receipt.py \
            --verify-hosted-run \
            --tested-revision "$TESTED_REVISION" \
            --proof-run-id "$PROOF_RUN_ID" \
            --generated-at "$generated_at" \
            --proof-run-url "$PROOF_RUN_URL"
          python tools/verify_source_freeze.py --json
          python tools/build_phase2_receipt.py --verify
          python tools/build_phase3_receipt.py --verify
          python tools/build_phase4_receipt.py --verify --verify-hosted-run
          git diff --check
          unexpected="$(git diff --name-only | grep -Ev '^(manifests/phase4_kirin_xray\.receipt\.json|manifests/source_inventory\.json)$' || true)"
          test -z "$unexpected" || {
            echo "Refusing to freeze unexpected files:" >&2
            echo "$unexpected" >&2
            exit 1
          }

      - name: Freeze traceable Phase 4 proof authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "THETECHGUY Phase 4 Freezer"
          git config user.email "actions@users.noreply.github.com"
          git add manifests/phase4_kirin_xray.receipt.json manifests/source_inventory.json
          git commit -m "Freeze Phase 4 Kirin Xray proof authority"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:phase4/harden-kirin-xray

name: Final Huawei UI Visual QA

on:
  push:
    branches: ["closeout/final-ui-completion"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: windows-2022
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install UI proof dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --disable-pip-version-check -e ".[test]"

      - name: Prove no-placeholder navigation contract
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pytest -q tests/test_ui_closeout.py

      - name: Capture all six main UI states at approved dimensions
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $ErrorActionPreference = "Stop"
          python tools/capture_ui_states.py

      - name: Upload visual QA evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: TECHGUYTOOL-Huawei-final-ui-visual-qa
          path: visual-qa/**
          if-no-files-found: error
          retention-days: 14

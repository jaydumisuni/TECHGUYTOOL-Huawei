name: Huawei UI Proof

on:
  push:
    branches: [main, "build/**"]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  source-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install source and proof dependencies
        run: python -m pip install -e ".[test]"
      - name: Export exact Qt wheels
        run: python -m pip download --only-binary=:all: --dest wheelhouse PySide6==6.11.1
      - name: Regenerate Qt resource manifest
        run: python tools/generate_qrc.py
      - name: Compile Qt resources
        run: pyside6-rcc resources.qrc -o techguy_huawei/resources_rc.py
      - name: Unit and contract tests
        run: python -m pytest -q
      - name: Strict SRG 20-for-2 review
        run: python tools/review_20_for_2.py --strict
      - name: Install Qt runtime dependency
        run: sudo apt-get update && sudo apt-get install -y libegl1
      - name: Real QML construction and screenshot proof
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          QT_QUICK_CONTROLS_STYLE: Basic
        run: python tools/smoke_qml.py
      - name: Upload QML proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: huawei-qml-proof
          path: proof/qml-main.png
          if-no-files-found: warn
      - name: Upload exact Qt wheelhouse
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: huawei-qt-wheelhouse
          path: wheelhouse
          if-no-files-found: error
      - name: Upload exact reviewed source workspace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: huawei-source-workspace
          path: |
            .
            !.git/**
            !.venv/**
            !proof/**
            !wheelhouse/**
            !runtime-export/**
          include-hidden-files: true
          if-no-files-found: error
      - name: Publish proof run marker
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          marker='runtime-export/latest-run.txt'
          content="$(printf '%s\n' "$GITHUB_RUN_ID" | base64 -w0)"
          existing="$(gh api "repos/$GITHUB_REPOSITORY/contents/$marker?ref=$GITHUB_REF_NAME" --jq .sha 2>/dev/null || true)"
          args=(--method PUT "repos/$GITHUB_REPOSITORY/contents/$marker" -f message="Record proof run $GITHUB_RUN_ID" -f content="$content" -f branch="$GITHUB_REF_NAME")
          if [ -n "$existing" ]; then args+=(-f sha="$existing"); fi
          gh api "${args[@]}"

name: Huawei UI mascot direct-source correction

on:
  push:
    branches: ["phase15/final-ui-closeout"]
    paths:
      - ".github/workflows/ui-mascot-direct-fix.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: phase15/final-ui-closeout
          fetch-depth: 0

      - name: Apply one bounded UI source correction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('qml/Main.qml')
          source = path.read_text(encoding='utf-8')
          old = '../assets/brand/techguy_mascot.svg'
          new = '../assets/brand/techguy_mascot.webp'
          if old not in source and new not in source:
              raise SystemExit('Mascot source marker missing')
          if old in source:
              path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
          rm -f .github/workflows/ui-mascot-direct-fix.yml
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected=$'.github/workflows/ui-mascot-direct-fix.yml\nqml/Main.qml'
          if [[ "$changed" != "$expected" ]]; then
            printf 'Unexpected changed files:\n%s\n' "$changed" >&2
            exit 1
          fi

      - name: Commit exact correction and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "THE TECH GUY"
          git config user.email "65334711+jaydumisuni@users.noreply.github.com"
          git add qml/Main.qml .github/workflows/ui-mascot-direct-fix.yml
          git commit -m "Load approved Huawei mascot directly in QML"
          git push origin HEAD:phase15/final-ui-closeout

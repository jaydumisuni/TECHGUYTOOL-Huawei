name: Workspace Runtime Export

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export-workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/huawei-ui-v0.1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Export exact Qt runtime wheels
        run: python -m pip download --only-binary=:all: --dest wheelhouse PySide6==6.11.1
      - name: Upload exact Qt wheelhouse
        uses: actions/upload-artifact@v4
        with:
          name: huawei-qt-wheelhouse
          path: wheelhouse
          if-no-files-found: error
      - name: Upload exact branch workspace
        uses: actions/upload-artifact@v4
        with:
          name: huawei-source-workspace
          path: |
            .
            !.git/**
            !wheelhouse/**
            !runtime-export/**
          include-hidden-files: true
          if-no-files-found: error
      - name: Publish export run marker
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          marker='runtime-export/latest-run.txt'
          content="$(printf '%s\n' "$GITHUB_RUN_ID" | base64 -w0)"
          existing="$(gh api "repos/$GITHUB_REPOSITORY/contents/$marker?ref=main" --jq .sha 2>/dev/null || true)"
          args=(--method PUT "repos/$GITHUB_REPOSITORY/contents/$marker" -f message="Record workspace export run $GITHUB_RUN_ID" -f content="$content" -f branch=main)
          if [ -n "$existing" ]; then args+=(-f sha="$existing"); fi
          gh api "${args[@]}"

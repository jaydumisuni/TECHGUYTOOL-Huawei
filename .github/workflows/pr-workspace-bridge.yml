name: PR Workspace Bridge

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  export-workspace:
    if: github.event.issue.pull_request && github.event.comment.body == '/workspace-export'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Export exact Qt runtime wheels
        run: python -m pip download --only-binary=:all: --dest wheelhouse PySide6==6.11.1
      - name: Upload exact Qt wheelhouse
        uses: actions/upload-artifact@v4
        with:
          name: huawei-qt-wheelhouse
          path: wheelhouse
          if-no-files-found: error
      - name: Upload exact PR workspace
        uses: actions/upload-artifact@v4
        with:
          name: huawei-source-workspace
          path: |
            .
            !.git/**
            !wheelhouse/**
          include-hidden-files: true
          if-no-files-found: error
      - name: Report bridge run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment "${{ github.event.issue.number }}" --body "WORKSPACE_BRIDGE_RUN_ID=${{ github.run_id }}"

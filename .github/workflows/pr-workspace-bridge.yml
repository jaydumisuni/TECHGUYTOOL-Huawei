name: Verified Workspace Import

on:
  push:
    branches: [main]
    paths: ["runtime-import/TRIGGER"]
  schedule:
    - cron: "0-59/5 * * * *"
    - cron: "1-59/5 * * * *"
    - cron: "2-59/5 * * * *"
    - cron: "3-59/5 * * * *"
    - cron: "4-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/huawei-ui-v0.1
          fetch-depth: 0
          persist-credentials: true

      - name: Detect pending verified import
        id: gate
        shell: bash
        run: |
          if [ -f workspace-import/READY ]; then
            echo "pending=true" >> "$GITHUB_OUTPUT"
          else
            echo "pending=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Reconstruct and verify exact workspace archive
        if: steps.gate.outputs.pending == 'true'
        shell: bash
        run: |
          set -euo pipefail
          expected='26bb4b9be2d1e3542ad607a0d39a9aae156b33a117180f7d2885654c6016543a'
          declared="$(tr -d '\r\n ' < workspace-import/READY)"
          test "$declared" = "$expected"
          find workspace-import -maxdepth 1 -type f -name 'part-*.b64' -print0 \
            | sort -z \
            | xargs -0 cat > /tmp/techguytool-huawei.b64
          base64 --decode /tmp/techguytool-huawei.b64 > /tmp/techguytool-huawei.tar.gz
          echo "$expected  /tmp/techguytool-huawei.tar.gz" | sha256sum --check --strict
          rm -rf /tmp/techguytool-huawei-import
          mkdir -p /tmp/techguytool-huawei-import
          tar -xzf /tmp/techguytool-huawei.tar.gz -C /tmp/techguytool-huawei-import
          test -s /tmp/techguytool-huawei-import/main.py
          test -s /tmp/techguytool-huawei-import/qml/Main.qml
          test -s /tmp/techguytool-huawei-import/techguy_huawei/task_controller.py
          test -s /tmp/techguytool-huawei-import/rust/health_core/Cargo.toml

      - name: Replace branch with proven workspace
        if: steps.gate.outputs.pending == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='.git/' /tmp/techguytool-huawei-import/ ./
          git config user.name 'THETECHGUY Workspace Importer'
          git config user.email 'actions@users.noreply.github.com'
          git add --all
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Verified workspace already matches branch.'
          else
            git commit -m 'Integrate proven Revive engine and responsive Huawei UI'
            git push origin HEAD:build/huawei-ui-v0.1
          fi

      - name: Publish completed import marker
        if: steps.gate.outputs.pending == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          marker='runtime-import/latest-run.txt'
          content="$(printf '%s\n' "$GITHUB_RUN_ID" | base64 -w0)"
          existing="$(gh api "repos/$GITHUB_REPOSITORY/contents/$marker?ref=main" --jq .sha 2>/dev/null || true)"
          args=(--method PUT "repos/$GITHUB_REPOSITORY/contents/$marker" -f message="Record verified workspace import $GITHUB_RUN_ID" -f content="$content" -f branch=main)
          if [ -n "$existing" ]; then args+=(-f sha="$existing"); fi
          gh api "${args[@]}"

name: PR Workspace Bridge

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  export-workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Export exact Qt runtime wheels
        run: python -m pip download --only-binary=:all: --dest wheelhouse PySide6==6.11.1
      - name: Upload exact Qt wheelhouse
        uses: actions/upload-artifact@v4
        with:
          name: huawei-qt-wheelhouse
          path: wheelhouse
          if-no-files-found: error
      - name: Upload exact PR workspace
        uses: actions/upload-artifact@v4
        with:
          name: huawei-source-workspace
          path: |
            .
            !.git/**
            !wheelhouse/**
          include-hidden-files: true
          if-no-files-found: error

name: One-shot Huawei Roadmap Authority Freezer

on:
  push:
    branches:
      - docs/current-execution-roadmap

permissions:
  contents: write

jobs:
  freeze:
    if: >-
      github.actor == 'jaydumisuni' &&
      startsWith(github.event.head_commit.message, 'Request roadmap authority freeze')
    runs-on: ubuntu-24.04
    steps:
      - name: Check out owner authority request
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Build final frozen receipt and remove one-shot workflow
        shell: bash
        env:
          OWNER_AUTHORITY_COMMIT: b549ec413c313cbec2be0bf9d81fc0f133494335
        run: |
          set -euo pipefail
          python tools/build_active_software_phase_receipt.py \
            --write \
            --run-id 31948147123 \
            --tested-revision 3c4c13421aefe716ea9d403ee286c5dd8f510db1
          python - <<'PY'
          import json, os
          from pathlib import Path
          config = json.load(open('manifests/active_software_phase.json', encoding='utf-8'))
          path = Path(config['receipt_path'])
          payload = json.loads(path.read_text(encoding='utf-8'))
          hosted = payload['hosted_proof']
          payload['owner_verification'] = {
              'authority_commit': os.environ['OWNER_AUTHORITY_COMMIT'],
              'source_proof_run_id': hosted['run_id'],
              'source_revision': hosted['tested_revision'],
              'status': 'CONFIRMED',
          }
          payload['status'] = 'FROZEN'
          path.write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
          rm -f .github/workflows/roadmap-authority-freezer.yml
          git diff --check

      - name: Commit frozen receipt and workflow removal
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "THETECHGUY Roadmap Authority"
          git config user.email "actions@users.noreply.github.com"
          git add manifests/phase15_windows_release.receipt.json .github/workflows/roadmap-authority-freezer.yml
          git commit -m "Freeze Huawei roadmap authority receipt"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:"$BRANCH_NAME"

name: Final Workspace Import

on:
  push:
    branches: ["build/huawei-ui-v0.1"]
    paths:
      - "final-patch-v1/**"
      - ".github/workflows/final-workspace-import.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "final-patch-v1/**"
      - ".github/workflows/final-workspace-import.yml"

permissions:
  contents: write

concurrency:
  group: final-workspace-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/huawei-ui-v0.1
          fetch-depth: 0

      - name: Reconstruct and validate staged workspace
        shell: bash
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/techguy-patch.tar.gz"
          for index in 000 001 002 003 004 005 006a 006b 007 008; do
            chunk="final-patch-v1/chunk-${index}.b64"
            test -s "$chunk"
            tr -d '\r\n\t ' < "$chunk" | base64 -d >> "$RUNNER_TEMP/techguy-patch.tar.gz"
          done
          gzip -t "$RUNNER_TEMP/techguy-patch.tar.gz"
          sha256sum "$RUNNER_TEMP/techguy-patch.tar.gz" | tee "$RUNNER_TEMP/archive.sha256"
          mkdir -p "$RUNNER_TEMP/patch"
          tar -xzf "$RUNNER_TEMP/techguy-patch.tar.gz" -C "$RUNNER_TEMP/patch"
          test -f "$RUNNER_TEMP/patch/qml/Main.qml"
          test -f "$RUNNER_TEMP/patch/qml/dialogs/TestpointDialog.qml"
          test -f "$RUNNER_TEMP/patch/qml/pages/DeviceInformationPage.qml"
          test -f "$RUNNER_TEMP/patch/resources/expected ui/01-firmware-flash.webp"
          test -f "$RUNNER_TEMP/patch/resources/expected ui/06-fastboot-terminal.webp"

      - name: Apply clean workspace and remove transfer material
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "$RUNNER_TEMP/patch/PATCH_DELETE.json" ]; then
            cp "$RUNNER_TEMP/patch/PATCH_DELETE.json" /tmp/patch-delete.json
            python -c "import json,shutil; from pathlib import Path; paths=json.loads(Path('/tmp/patch-delete.json').read_text(encoding='utf-8')); [(p.unlink() if p.is_file() or p.is_symlink() else shutil.rmtree(p) if p.is_dir() else None) for p in map(Path, paths)]"
          fi
          rm -f "$RUNNER_TEMP/patch/PATCH_DELETE.json" "$RUNNER_TEMP/patch/PATCH_MANIFEST.json"
          cp -a "$RUNNER_TEMP/patch/." .
          rm -rf final-patch-v1 final-import-v2 workspace-import
          rm -f .github/workflows/final-workspace-import.yml
          test ! -e qml/pages/PlaceholderPage.qml
          test -f qml/dialogs/TestpointDialog.qml
          test -f "resources/expected ui/06-fastboot-terminal.webp"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No workspace changes to commit"
            exit 0
          fi
          git commit -m "Expand verified TECHGUYTOOL Huawei workspace"
          git push origin HEAD:build/huawei-ui-v0.1

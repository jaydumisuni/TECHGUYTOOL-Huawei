name: Final Workspace Import

on:
  push:
    branches: ["build/huawei-ui-v0.1"]
    paths:
      - "final-import-v2/**"
      - ".github/workflows/final-workspace-import.yml"

permissions:
  contents: write

concurrency:
  group: final-workspace-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/huawei-ui-v0.1
          fetch-depth: 0
      - name: Wait for complete verified archive
        id: ready
        shell: bash
        run: |
          if [ ! -f final-import-v2/READY ]; then
            echo "complete=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "complete=true" >> "$GITHUB_OUTPUT"
      - name: Reconstruct and verify exact workspace
        if: steps.ready.outputs.complete == 'true'
        shell: bash
        run: |
          expected="$(tr -d '\r\n ' < final-import-v2/READY)"
          cat final-import-v2/chunk-*.b64 | base64 -d > "$RUNNER_TEMP/techguy-final.tar.gz"
          actual="$(sha256sum "$RUNNER_TEMP/techguy-final.tar.gz" | awk '{print $1}')"
          test "$actual" = "$expected"
          mkdir -p "$RUNNER_TEMP/workspace"
          tar -xzf "$RUNNER_TEMP/techguy-final.tar.gz" -C "$RUNNER_TEMP/workspace"
          test -f "$RUNNER_TEMP/workspace/qml/Main.qml"
          test -f "$RUNNER_TEMP/workspace/resources/expected ui/01-firmware-flash.webp"
          test ! -f "$RUNNER_TEMP/workspace/qml/pages/PlaceholderPage.qml"
      - name: Replace branch with proven workspace
        if: steps.ready.outputs.complete == 'true'
        shell: bash
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$RUNNER_TEMP/workspace/." .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finish Upgrade Mode and Testpoint service workflow"
          git push origin HEAD:build/huawei-ui-v0.1

name: Final Workspace Import

on:
  push:
    branches: ["build/huawei-ui-v0.1"]
    paths:
      - "final-patch-v1/**"
      - ".github/workflows/final-workspace-import.yml"

permissions:
  contents: write

concurrency:
  group: final-workspace-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/huawei-ui-v0.1
          fetch-depth: 0
      - name: Wait for complete verified patch
        id: ready
        shell: bash
        run: |
          if [ ! -f final-patch-v1/READY ]; then
            echo "complete=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "complete=true" >> "$GITHUB_OUTPUT"
      - name: Reconstruct and verify patch
        if: steps.ready.outputs.complete == 'true'
        shell: bash
        run: |
          expected="$(tr -d '\r\n ' < final-patch-v1/READY)"
          cat final-patch-v1/chunk-*.b64 | base64 -d > "$RUNNER_TEMP/techguy-patch.tar.gz"
          actual="$(sha256sum "$RUNNER_TEMP/techguy-patch.tar.gz" | awk '{print $1}')"
          test "$actual" = "$expected"
          mkdir -p "$RUNNER_TEMP/patch"
          tar -xzf "$RUNNER_TEMP/techguy-patch.tar.gz" -C "$RUNNER_TEMP/patch"
          test -f "$RUNNER_TEMP/patch/qml/Main.qml"
          test -f "$RUNNER_TEMP/patch/resources/expected ui/01-firmware-flash.webp"
          test -f "$RUNNER_TEMP/patch/qml/pages/DeviceInformationPage.qml"
      - name: Apply proven patch
        if: steps.ready.outputs.complete == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for relative in json.loads(Path('/tmp/patch-delete.json').read_text()) if Path('/tmp/patch-delete.json').exists() else []:
              target = Path(relative)
              if target.is_file() or target.is_symlink():
                  target.unlink()
              elif target.is_dir():
                  import shutil
                  shutil.rmtree(target)
          PY
        env:
          PATCH_DELETE: unused
      - name: Overlay files, remove staging, and commit
        if: steps.ready.outputs.complete == 'true'
        shell: bash
        run: |
          cp "$RUNNER_TEMP/patch/PATCH_DELETE.json" /tmp/patch-delete.json
          python - <<'PY'
          import json, shutil
          from pathlib import Path
          for relative in json.loads(Path('/tmp/patch-delete.json').read_text()):
              target = Path(relative)
              if target.is_file() or target.is_symlink(): target.unlink()
              elif target.is_dir(): shutil.rmtree(target)
          PY
          rm -f "$RUNNER_TEMP/patch/PATCH_DELETE.json" "$RUNNER_TEMP/patch/PATCH_MANIFEST.json"
          cp -a "$RUNNER_TEMP/patch/." .
          rm -rf final-patch-v1 final-import-v2 workspace-import .github/workflows/final-workspace-import.yml
          test ! -e qml/pages/PlaceholderPage.qml
          test -f qml/dialogs/TestpointDialog.qml
          test -f "resources/expected ui/06-fastboot-terminal.webp"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finish Upgrade Mode and Testpoint service workflow"
          git push origin HEAD:build/huawei-ui-v0.1

name: Finalize Huawei mascot PNG asset

on:
  push:
    branches: ["phase15/final-ui-closeout"]
    paths:
      - ".github/workflows/ui-mascot-png-finalize.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact UI branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: phase15/final-ui-closeout
          fetch-depth: 0

      - name: Convert approved clean mascot to native PNG and wire QML
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          asset_dir = Path('assets/brand')
          webp = asset_dir / 'techguy_mascot.webp'
          png = asset_dir / 'techguy_mascot.png'
          if not webp.is_file():
              raise SystemExit('Clean mascot WebP source is missing')
          image = Image.open(webp).convert('RGBA')
          image.thumbnail((360, 360), Image.Resampling.LANCZOS)
          canvas = Image.new('RGBA', (360, 360), (0, 0, 0, 0))
          canvas.alpha_composite(image, ((360-image.width)//2, (360-image.height)//2))
          canvas.save(png, 'PNG', optimize=True, compress_level=9)

          main = Path('qml/Main.qml')
          source = main.read_text(encoding='utf-8')
          if '../assets/brand/techguy_mascot.webp' not in source:
              raise SystemExit('Direct WebP mascot marker missing from Main.qml')
          main.write_text(source.replace('../assets/brand/techguy_mascot.webp', '../assets/brand/techguy_mascot.png', 1), encoding='utf-8')

          qrc = Path('resources.qrc')
          text = qrc.read_text(encoding='utf-8')
          lines = [line for line in text.splitlines() if 'assets/brand/techguy_mascot.svg' not in line and 'assets/brand/techguy_mascot.webp' not in line]
          insert_at = next((i + 1 for i, line in enumerate(lines) if 'assets/brand/techguy_logo.svg' in line), None)
          if insert_at is None:
              raise SystemExit('Brand QRC anchor missing')
          lines.insert(insert_at, '    <file alias="assets/brand/techguy_mascot.png">assets/brand/techguy_mascot.png</file>')
          qrc.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          git rm -f assets/brand/techguy_mascot.svg assets/brand/techguy_mascot.webp
          rm -f .github/workflows/ui-mascot-png-finalize.yml
          git diff --check

      - name: Commit clean Qt-native mascot state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "THE TECH GUY"
          git config user.email "65334711+jaydumisuni@users.noreply.github.com"
          git add qml/Main.qml resources.qrc assets/brand/techguy_mascot.png .github/workflows/ui-mascot-png-finalize.yml
          git commit -m "Use Qt-native approved Huawei mascot PNG"
          git push origin HEAD:phase15/final-ui-closeout

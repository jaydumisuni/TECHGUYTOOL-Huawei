name: Phase 6 One-Shot Rustfmt

on:
  push:
    branches: ["phase6/mode-execution-leases"]

permissions:
  contents: write

jobs:
  format:
    if: >-
      github.actor == 'jaydumisuni' &&
      startsWith(github.event.head_commit.message, 'Request Phase 6 rustfmt')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Install reviewed Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.75.0 --profile minimal --component rustfmt
          rustup override set 1.75.0
      - name: Apply exact formatter and remove unused import
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('rust/device_gateway/src/lease.rs')
          text = path.read_text(encoding='utf-8').replace('use chrono::{DateTime, Utc};', 'use chrono::DateTime;')
          path.write_text(text, encoding='utf-8')
          PY
          cargo fmt --manifest-path rust/device_gateway/Cargo.toml
          git diff --check
          unexpected="$(git diff --name-only | grep -Ev '^(rust/device_gateway/src/lease\.rs|rust/device_gateway/tests/leases\.rs)$' || true)"
          test -z "$unexpected" || { echo "$unexpected" >&2; exit 1; }
      - name: Commit formatted Phase 6 Rust
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "THETECHGUY Phase 6 Formatter"
          git config user.email "actions@users.noreply.github.com"
          git add rust/device_gateway/src/lease.rs rust/device_gateway/tests/leases.rs
          git commit -m "Format Phase 6 Rust lease authority"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:phase6/mode-execution-leases

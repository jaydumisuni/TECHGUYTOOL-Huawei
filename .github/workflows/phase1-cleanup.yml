name: Finalize Huawei Phase 1 Source Freeze

on:
  push:
    branches: ["phase1/source-freeze"]
    paths: ["phase1-cleanup/TRIGGER"]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1/source-freeze
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Recover frozen plan and remove transfer debris
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:FULL_PLAN.md > FULL_PLAN.md
          rm -rf \
            final-patch-v1 \
            workspace-import \
            runtime-import \
            runtime-export \
            phase1-cleanup \
            transfer-probe-2.tmp \
            transfer-probe-3.tmp \
            transfer-test.tmp \
            .github/workflows/final-workspace-import.yml \
            .github/workflows/phase1-cleanup.yml
          grep -RIl --exclude-dir=.git 'TECHGUY_TOOL_Huawei.exe' . \
            | xargs -r sed -i 's/TECHGUY_TOOL_Huawei.exe/TECHGUYTOOL_Huawei.exe/g'

      - name: Build exact source inventory
        run: python tools/build_source_inventory.py

      - name: Install source and proof dependencies
        run: python -m pip install -e ".[test]"

      - name: Prove clean Phase 1 checkpoint
        shell: bash
        run: |
          set -euo pipefail
          python tools/verify_source_freeze.py --json
          python -m compileall -q main.py techguy_huawei tools tests
          python -m pytest -q
          python tools/verify_qml.py
          python tools/review_20_for_2.py --strict

      - name: Commit exact source-freeze checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'THETECHGUY Phase 1 Freezer'
          git config user.email 'actions@users.noreply.github.com'
          git add --all
          git diff --cached --check
          git commit -m 'Freeze Huawei Phase 1 source and artifact authority'
          git push origin HEAD:phase1/source-freeze

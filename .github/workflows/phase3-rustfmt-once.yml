name: Phase 3 One-Shot Rustfmt

on:
  push:
    branches: ["phase3/device-gateway"]

permissions:
  contents: read

jobs:
  format:
    if: github.actor == 'jaydumisuni'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the owner-authored source revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Install reviewed Rust formatter
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.75.0 --profile minimal --component rustfmt
          rustup override set 1.75.0

      - name: Apply deterministic rustfmt
        run: cargo fmt --manifest-path rust/device_gateway/Cargo.toml

      - name: Commit only deterministic Rust formatting
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          unexpected="$(git diff --name-only | grep -Ev '^rust/device_gateway/.*\.rs$' || true)"
          test -z "$unexpected" || {
            echo "Rustfmt changed an unexpected path:" >&2
            echo "$unexpected" >&2
            exit 1
          }
          if git diff --quiet -- rust/device_gateway; then
            echo "Rust source is already formatted."
            exit 0
          fi
          git config user.name "THETECHGUY Rust Formatter"
          git config user.email "actions@users.noreply.github.com"
          git add rust/device_gateway
          git commit -m "Apply reviewed Rust 1.75 formatting"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:phase3/device-gateway

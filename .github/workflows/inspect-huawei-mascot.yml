name: Inspect Huawei Mascot Source

on:
  push:
    branches:
      - phase15/final-ui-closeout
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Prove source asset exists
        shell: bash
        run: |
          set -euo pipefail
          test -s 'resources/ghost hoody.png'
          file 'resources/ghost hoody.png'
          sha256sum 'resources/ghost hoody.png'

      - name: Upload exact repository mascot source
        uses: actions/upload-artifact@v4
        with:
          name: huawei-mascot-source-inspection
          path: resources/ghost hoody.png
          if-no-files-found: error

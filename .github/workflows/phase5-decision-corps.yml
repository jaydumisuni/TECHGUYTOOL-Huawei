name: Phase 5 Repair Decision Corps

on:
  push:
    branches: ["phase5/repair-decision-corps-v2"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: phase5-decision-corps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - name: Check out reviewed revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install Rust 1.75
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.75.0 --profile minimal --component rustfmt --component clippy
          rustup override set 1.75.0
          rustc --version
          cargo --version

      - name: Install proof dependencies
        run: python -m pip install --disable-pip-version-check pytest==8.3.5

      - name: Compile Phase 5 Python
        run: >-
          python -m compileall -q
          techguy_huawei/decision_corps.py
          tests/test_decision_corps.py
          tools/prove_decision_corps.py
          tools/build_phase5_receipt.py
          tools/build_phase4_receipt.py
          tools/build_source_inventory.py

      - name: Test deterministic Decision Corps
        run: python -m pytest tests/test_decision_corps.py -q

      - name: Prove historical Phase 5 exit gate
        run: python tools/prove_decision_corps.py

      - name: Regenerate deterministic source inventory before global review
        run: python tools/build_source_inventory.py

      - name: SRG 20-for-2 independent review gate
        run: python tools/review_20_for_2.py --strict

      - name: Re-prove frozen Phase 4 Xray authority
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m pytest tests/test_kirin_xray.py tests/test_kirin_xray_authority.py -q
          python tools/build_phase4_receipt.py --verify --verify-hosted-run

      - name: Re-prove Phase 2 and Phase 3 contracts and Gateway
        run: |
          python -m pytest tests/test_shared_contracts.py tests/test_gateway_client.py -q
          cargo test --locked --manifest-path rust/contracts_core/Cargo.toml --all-targets
          cargo test --locked --manifest-path rust/device_gateway/Cargo.toml --all-targets
          python tools/build_phase2_receipt.py --verify
          python tools/build_phase3_receipt.py --verify

      - name: Check frozen Rust formatting and warnings
        run: |
          cargo fmt --manifest-path rust/contracts_core/Cargo.toml -- --check
          cargo fmt --manifest-path rust/device_gateway/Cargo.toml -- --check
          cargo clippy --locked --manifest-path rust/device_gateway/Cargo.toml --all-targets -- -D warnings

      - name: Run complete Python regression
        run: python -m pytest -q

      - name: Verify source freeze
        run: python tools/verify_source_freeze.py --json

      - name: Verify generated paths and Phase 5 authority
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_TOKEN: ${{ github.token }}
          IS_SOURCE_FREEZE: ${{ startsWith(github.event.head_commit.message, 'Freeze Phase 5 source inventory') }}
          IS_AUTHORITY_FREEZE: ${{ startsWith(github.event.head_commit.message, 'Freeze Phase 5 Decision Corps proof authority') }}
          IS_OWNER_VERIFICATION: ${{ startsWith(github.event.head_commit.message, 'Confirm Phase 5 owner verification') }}
        run: |
          set -euo pipefail
          git diff --check
          unexpected="$(git diff --name-only | grep -Ev '^manifests/source_inventory\.json$' || true)"
          test -z "$unexpected" || {
            echo "Unexpected generated source changes:" >&2
            echo "$unexpected" >&2
            exit 1
          }
          if [[ "$EVENT_NAME" == "pull_request" || "$IS_SOURCE_FREEZE" == "true" || "$IS_AUTHORITY_FREEZE" == "true" || "$IS_OWNER_VERIFICATION" == "true" ]]; then
            git diff --exit-code -- manifests/source_inventory.json
          fi
          if [[ "$EVENT_NAME" == "pull_request" || "$IS_AUTHORITY_FREEZE" == "true" || "$IS_OWNER_VERIFICATION" == "true" ]]; then
            python tools/build_phase5_receipt.py --verify --verify-hosted-run
          fi

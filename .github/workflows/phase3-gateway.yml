name: Phase 3 TTG Device Gateway

on:
  push:
    branches: ["phase3/device-gateway"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase3-gateway-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gateway-proof:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact reviewed revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install reviewed Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.75.0 --profile minimal --component rustfmt --component clippy
          rustup override set 1.75.0
          rustc --version
          cargo --version

      - name: Install Python proof dependency
        run: python -m pip install --disable-pip-version-check pytest==8.3.5

      - name: Resolve the gateway dependency lock
        run: cargo generate-lockfile --manifest-path rust/device_gateway/Cargo.toml

      - name: Compile deterministic Python gateway modules
        run: >-
          python -m compileall -q
          techguy_huawei/gateway_client.py
          tests/test_gateway_client.py
          tools/build_phase2_receipt.py
          tools/build_phase3_receipt.py
          tools/build_source_inventory.py
          tools/prove_gateway_reconnect.py

      - name: Prove Python gateway client behavior
        run: python -m pytest tests/test_gateway_client.py -q

      - name: Check gateway Rust formatting
        run: cargo fmt --manifest-path rust/device_gateway/Cargo.toml -- --check

      - name: Reject gateway Rust warnings
        run: >-
          cargo clippy --locked
          --manifest-path rust/device_gateway/Cargo.toml
          --all-targets -- -D warnings

      - name: Prove gateway Rust behavior
        run: cargo test --locked --manifest-path rust/device_gateway/Cargo.toml --all-targets

      - name: Build deterministic gateway binary
        run: >-
          cargo build --locked
          --manifest-path rust/device_gateway/Cargo.toml
          --bin ttg-device-gateway

      - name: Prove UI reconnect and gateway process recovery
        run: >-
          python tools/prove_gateway_reconnect.py
          --gateway-bin rust/device_gateway/target/debug/ttg-device-gateway

      - name: Re-prove frozen Phase 2 contracts
        run: |
          python -m pytest tests/test_shared_contracts.py -q
          cargo test --manifest-path rust/contracts_core/Cargo.toml --locked --all-targets

      - name: Regenerate deterministic source inventory
        run: python tools/build_source_inventory.py

      - name: Run complete non-Qt Python regression suite
        run: python -m pytest -q

      - name: Verify source and receipt authority
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          IS_FREEZE_COMMIT: ${{ startsWith(github.event.head_commit.message, 'Freeze Phase 3 gateway inventory and proof receipt') }}
          IS_OWNER_VERIFICATION: ${{ startsWith(github.event.head_commit.message, 'Confirm Phase 3 owner verification') }}
        run: |
          set -euo pipefail
          python tools/verify_source_freeze.py --json
          python tools/build_phase2_receipt.py --verify
          git diff --check
          unexpected="$(git diff --name-only | grep -Ev '^(manifests/source_inventory\.json|rust/device_gateway/Cargo\.lock)$' || true)"
          test -z "$unexpected" || {
            echo "Unexpected generated source changes:" >&2
            echo "$unexpected" >&2
            exit 1
          }
          if [[ "$EVENT_NAME" == "pull_request" || "$IS_FREEZE_COMMIT" == "true" || "$IS_OWNER_VERIFICATION" == "true" ]]; then
            git diff --exit-code -- manifests/source_inventory.json rust/device_gateway/Cargo.lock
            python tools/build_phase3_receipt.py --verify
          fi

  freeze-authority:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/phase3/device-gateway' &&
      github.actor == 'jaydumisuni' &&
      !startsWith(github.event.head_commit.message, 'Freeze Phase 3 gateway inventory and proof receipt') &&
      !startsWith(github.event.head_commit.message, 'Confirm Phase 3 owner verification')
    needs: gateway-proof
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the proven source revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Install Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install reviewed Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.75.0 --profile minimal
          rustup override set 1.75.0

      - name: Generate traceable Phase 3 authority files
        shell: bash
        env:
          TESTED_REVISION: ${{ github.sha }}
          PROOF_RUN_ID: ${{ github.run_id }}
          PROOF_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          generated_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          cargo generate-lockfile --manifest-path rust/device_gateway/Cargo.toml
          python tools/build_source_inventory.py
          python tools/build_phase3_receipt.py \
            --tested-revision "$TESTED_REVISION" \
            --proof-run-id "$PROOF_RUN_ID" \
            --generated-at "$generated_at" \
            --proof-run-url "$PROOF_RUN_URL"
          python tools/verify_source_freeze.py --json
          python tools/build_phase2_receipt.py --verify
          python tools/build_phase3_receipt.py --verify
          git diff --check
          unexpected="$(git diff --name-only | grep -Ev '^(manifests/phase3_gateway\.receipt\.json|manifests/source_inventory\.json|rust/device_gateway/Cargo\.lock)$' || true)"
          test -z "$unexpected" || {
            echo "Refusing to freeze unexpected files:" >&2
            echo "$unexpected" >&2
            exit 1
          }

      - name: Freeze Phase 3 authority on branch
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- manifests/phase3_gateway.receipt.json manifests/source_inventory.json rust/device_gateway/Cargo.lock; then
            echo "Phase 3 authority is already frozen."
            exit 0
          fi
          git config user.name "THETECHGUY Phase Freezer"
          git config user.email "actions@users.noreply.github.com"
          git add manifests/phase3_gateway.receipt.json manifests/source_inventory.json rust/device_gateway/Cargo.lock
          git commit -m "Freeze Phase 3 gateway inventory and proof receipt"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:phase3/device-gateway

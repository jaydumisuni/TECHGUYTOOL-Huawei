name: One-shot Huawei Roadmap Source Freezer

on:
  push:
    branches:
      - docs/current-execution-roadmap

permissions:
  contents: write

jobs:
  freeze:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out roadmap branch
        uses: actions/checkout@v4
        with:
          ref: docs/current-execution-roadmap
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Remove one-shot workflow before final inventory
        shell: bash
        run: rm -f .github/workflows/roadmap-source-freezer.yml

      - name: Regenerate deterministic source inventory
        shell: bash
        run: python tools/build_source_inventory.py

      - name: Commit final roadmap authority
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No freeze changes required."
            exit 0
          fi
          git commit -m "Freeze current Huawei roadmap source inventory"
          git push origin HEAD:docs/current-execution-roadmap

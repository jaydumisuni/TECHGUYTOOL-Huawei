name: Software Phase Source Freezer

on:
  push:
    branches: ["phase*/**"]

permissions:
  contents: write

jobs:
  freeze:
    if: >-
      github.actor == 'jaydumisuni' &&
      startsWith(github.event.head_commit.message, 'Request software phase source inventory freeze')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Build exact source inventory
        shell: bash
        run: |
          set -euo pipefail
          python tools/build_source_inventory.py
          python tools/verify_source_freeze.py --json
          git diff --check
          unexpected="$(git diff --name-only | grep -Ev '^manifests/source_inventory\.json$' || true)"
          test -z "$unexpected" || { echo "$unexpected" >&2; exit 1; }
      - name: Freeze inventory on active phase branch
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if git diff --quiet -- manifests/source_inventory.json; then
            echo "Source inventory already frozen."
            exit 0
          fi
          git config user.name "THETECHGUY Software Phase Freezer"
          git config user.email "actions@users.noreply.github.com"
          git add manifests/source_inventory.json
          git commit -m "Freeze active software phase source inventory"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:"$BRANCH_NAME"

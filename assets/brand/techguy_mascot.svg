<svg xmlns="http://www.w3.org/2000/svg" width="300" height="370" viewBox="0 0 300 370">
  <defs>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="300" height="370" fill="#06111d" opacity="0"/>
  <image x="0" y="0" width="300" height="370" preserveAspectRatio="xMidYMid meet"
         href="data:image/webp;base64," filter="url(#softGlow)"/>
</svg>

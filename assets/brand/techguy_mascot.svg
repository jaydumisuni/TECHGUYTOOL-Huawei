<svg xmlns="http://www.w3.org/2000/svg" width="300" height="370" viewBox="0 0 300 370">
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#20d7ff"/>
      <stop offset="0.42" stop-color="#4c7bff"/>
      <stop offset="1" stop-color="#cf4dff"/>
    </linearGradient>
    <linearGradient id="edge2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e94dff"/>
      <stop offset="0.55" stop-color="#7955ff"/>
      <stop offset="1" stop-color="#20d7ff"/>
    </linearGradient>
    <radialGradient id="hood" cx="50%" cy="29%" r="75%">
      <stop offset="0" stop-color="#17213f"/>
      <stop offset="0.42" stop-color="#0a1123"/>
      <stop offset="1" stop-color="#01040b"/>
    </radialGradient>
    <linearGradient id="cloak" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071424"/>
      <stop offset="0.52" stop-color="#020711"/>
      <stop offset="1" stop-color="#0a0718"/>
    </linearGradient>
    <linearGradient id="android" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e4ff68"/>
      <stop offset="1" stop-color="#62e32f"/>
    </linearGradient>
    <filter id="glow" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="5.2" result="blur"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.1" result="soft"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="soft"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="smallGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <ellipse cx="151" cy="327" rx="105" ry="25" fill="#204dff" opacity="0.08" filter="url(#glow)"/>

  <!-- Hood and cloak -->
  <g filter="url(#glow)">
    <path d="M150 18 C105 27 83 61 80 111 C58 136 47 173 49 215 C51 278 82 326 111 348 C128 361 172 361 190 348 C220 326 250 278 252 215 C254 174 244 136 220 111 C217 61 195 27 150 18 Z"
          fill="url(#cloak)" stroke="url(#edge)" stroke-width="3.1"/>
    <path d="M83 116 C94 79 116 48 150 33 C185 48 207 79 218 116 C201 98 177 88 150 88 C123 88 100 98 83 116 Z"
          fill="url(#hood)" stroke="url(#edge2)" stroke-width="2.2"/>
    <path d="M84 115 C65 142 60 170 63 201" fill="none" stroke="#28cfff" stroke-width="2.1" opacity="0.75"/>
    <path d="M216 115 C235 143 240 171 237 202" fill="none" stroke="#b14dff" stroke-width="2.1" opacity="0.85"/>
  </g>

  <!-- Face shadow and glasses -->
  <ellipse cx="150" cy="132" rx="53" ry="43" fill="#010309" opacity="0.94"/>
  <g fill="none" stroke="#e7f3ff" stroke-width="3" filter="url(#smallGlow)">
    <rect x="105" y="119" width="41" height="27" rx="10"/>
    <rect x="155" y="119" width="41" height="27" rx="10"/>
    <path d="M146 130 H155 M99 126 L106 130 M196 130 L202 125"/>
  </g>
  <path d="M112 155 C133 168 168 168 189 155" fill="none" stroke="#142646" stroke-width="3" opacity="0.9"/>

  <!-- Cloak folds -->
  <path d="M86 189 C104 205 116 227 119 265" fill="none" stroke="#1b3563" stroke-width="2" opacity="0.55"/>
  <path d="M214 189 C196 205 184 228 181 266" fill="none" stroke="#5c2b78" stroke-width="2" opacity="0.55"/>
  <path d="M150 181 C142 229 140 285 150 345" fill="none" stroke="#263a68" stroke-width="2" opacity="0.32"/>

  <!-- Left arm / Android -->
  <g filter="url(#smallGlow)">
    <path d="M100 212 C72 208 48 220 35 245 C27 260 30 278 44 284 C55 289 65 281 67 270 C74 286 94 290 107 276"
          fill="#03101b" stroke="#27cfff" stroke-width="2.7"/>
    <g transform="translate(24 226)">
      <path d="M19 18 L14 7 M51 18 L56 7" stroke="#d5ff65" stroke-width="3" stroke-linecap="round"/>
      <path d="M16 24 Q35 8 54 24 V59 Q54 67 47 67 H23 Q16 67 16 59 Z" fill="url(#android)" stroke="#e1ff79" stroke-width="2"/>
      <circle cx="27" cy="29" r="2.5" fill="#08250e"/><circle cx="43" cy="29" r="2.5" fill="#08250e"/>
      <path d="M10 35 V55 M60 35 V55 M25 67 V80 M45 67 V80" stroke="#a2f044" stroke-width="7" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Right arm / service tool -->
  <g filter="url(#smallGlow)">
    <path d="M200 212 C229 207 253 221 265 246 C273 262 268 279 255 284 C244 288 235 281 233 270 C226 286 206 290 193 276"
          fill="#08091a" stroke="#aa4dff" stroke-width="2.7"/>
    <g transform="translate(223 205) rotate(14)">
      <path d="M26 0 C36 5 38 16 32 25 L18 40 L8 30 L22 16 C25 13 24 9 21 7 Z" fill="#14223d" stroke="#d356ff" stroke-width="3"/>
      <path d="M8 30 L-24 61 C-30 67 -19 77 -13 71 L18 40 Z" fill="#07172c" stroke="#6e93ff" stroke-width="3"/>
      <circle cx="-18" cy="66" r="4" fill="none" stroke="#d45cff" stroke-width="2"/>
    </g>
  </g>

  <path d="M101 335 C124 353 176 353 199 335" fill="none" stroke="#8b5aff" stroke-width="2" opacity="0.8" filter="url(#smallGlow)"/>
</svg>
